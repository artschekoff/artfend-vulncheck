rules:
  - id: llm-prompt-injection
    patterns:
      - pattern: |
          {"content": f"...$INPUT..."}
    message: >
      Unsanitized variable is interpolated directly into an LLM prompt message.
      An attacker can inject instructions that override the system prompt.
      Sanitize and validate user input before including it in LLM messages.
    severity: ERROR
    languages: [python]
    metadata:
      owasp_llm: LLM01
      cwe: CWE-77
