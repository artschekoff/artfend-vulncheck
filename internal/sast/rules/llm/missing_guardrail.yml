rules:
  - id: llm-missing-guardrail
    pattern: $CLIENT.chat.completions.create(...)
    message: >
      LLM API call detected. Advisory: verify that a guardrail validation step
      (e.g., NeMo Guardrails, LLM Guard, input sanitization) is applied to
      inputs and outputs surrounding this call. This rule flags all calls for review.
    severity: WARNING
    languages: [python]
